<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book Search - Home</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header class="header">
        <h1>Open Library Search</h1>

        <nav> 
            <a href="bookSearch.html">Home</a>
            <a href="bookshelf.html">My Bookshelf</a>
        </nav>
    </header>

    <main>
      <h2>Booksearch</h2>

      <p>Enter a keyword for a book you are interested in.</p>

      <input type="text" id="searchInput" placeholder="enter book title or keyword">

      <button id="searchButton">Search</button>

        <div id="pagination" style ="display: none;">
            <label for="pageSelect">Select Page:</label>

            <select id="pageSelect">
                <option value="1">Page1</option>
                <option value="2">Page2</option>
                <option value="3">Page3</option>
                <option value="4">Page4</option>
                <option value="5">Page5</option>
                <option value="6">Page6</option>
            </select>
        </div>

      <div id="searchResults"></div>

    </main>

    <script>
        $(document).ready(function() {

            var searchTerm = "";
            var currentPage =1;

            $("#searchButton").click(function() {

                searchTerm =$("#searchInput").val().trim();
                currentPage = 1;

                if (searchTerm === "") {
                    $("#pagination").hide();
                    $("#searchResults").text("Don't leave me empty.");
                    return;
                }

                $("#pageSelect").val("1");
                searchBooks();
                
            });

            $("#pageSelect").change(function() {
                currentPage = Number($("#pageSelect").val());
                searchBooks();
            });
            function searchBooks() {
                
                var url = "https://openlibrary.org/search.json?q="
                    + encodeURIComponent(searchTerm) 
                    + "&limit=10&page=" + currentPage;
                

                $("#searchResults").text("Searching...");

                $.getJSON(url, function(data) {
                    $("#searchResults").empty();

                    if(data.docs.length ===0) {
                        $("#pagination").hide();
                        $("#searchResults").text("No books found.");
                        return;
                    }

                    var totalResults =data.numFound || 0;
                    var totalPages = Math.min(6, Mathe.ceil(totalResults / 10));

                    $("#pageSelect").empty();

                    for(var p = 1; p <= totalPages; p++) {
                        $("#pageSelect").append(
                            $("<option></option>")
                                .val(p)
                                .text("Page " + p)
                        );
                    }

                    $("#pageSelect").val(String(currentPage));
                    $("#pagination").show():
                    

                    for (var i=0; i < data.docs.length; i++) {
                        var book = data.docs{i};
                        var title = book.title || "Unknown Title";
                        
                        var result = $("<div></div>");
                        result.append($("<h3></h3>").text(title));

                        if (book.cover_i) {
                            var cover = "https://covers.openlibrary.org/b/id/"
                                + book.cover_i + "-S.jpg";

                            result.append($("<img>").attr("src", cover)
                                          .attr("alt", "Cover of "+ title));
                        } else {
                            result.append("<p>No cover available</p>");
                        }

                        $("#searchResults").append(result);
                    }
                }).fail(function() {
                    $("#pagination").hide();
                    $("#searchResults").text("Unable to retreive books.");
                });
            });
        });
    </script>
                                                          

</body>
</html>
