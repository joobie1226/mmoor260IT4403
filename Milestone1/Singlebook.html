<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Single-Book Data</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
            .header {
    width: 100%;
    margin: 30px auto 0;
    padding: 25px;

    background-color: #f5f5f5;

    text-align: center;

    box-sizing: border-box;

}

.header h1 {
    margin: 0;
    font-size: 36px;
    text-align: center;
}

.header h2 {
    margin: 5px 0 0;
    font-size: 28px;
    text-align: center;
}


main {
    width: 100%;
    margin: 0;

    background-color: #f5f5f5;

    flex: 1;

    padding: 60px 10%;

    box-sizing: border-box;

    text-align: center;
}

.book-container {
    max-width: 900px;
    margin: 0 auto;
}

.book-container h1 {
    text-align: center;
    font-size: 36px;
    margin-bottom: 40px;
}

#bookinfo {
    font-size: 18px;
    line-height: 1.5;
}

footer {
    width: 100%;
    margin: 0 auto;

    background-color: black;
    color: white;

    text-align: center;

    padding: 10px 0;
}

footer a {
    color: white;
    font-weight: bold;
}

footer p {
    color: red;
    font-size: 13px;
    margin: 5px 0;
}


    </style>

</head>

<body>

    <header class="header">
        <h1>Matthew Moore</h1>
        <h2>Kennesaw State University</h2>
    </header>

    <main>
        <div class="book-container">

            <h1>Book Information</h1>

            <div id="bookinfo">

            </div>

        </div>

    </main>


    <footer>
        <a href="https://ccse.kennesaw.edu/it/">
            CCSE Department of IT Website
        </a>

        <p>
            This is a student website created for course projects in IT 4403 <br>
          
        </p>
    </footer>

    <script>
        $(document).ready(function() {
            $.getJSON("openlibrary-book.json", function(data) {
                    $("#bookinfo").html(

                      "<p><strong>Title:</strong> " +
                        data.title +
                        "</p>" +

                        "<p><strong>Publisher:</strong> " +
                        data.publishers[0] +
                        "</p>" +

                        "<p><strong>Publication Date:</strong> " +
                        data.publish_date +
                        "</p>" +

                        "<p><strong>Number of Pages:</strong> " +
                        data.number_of_pages +
                        "</p>" +

                        "<p><strong>ISBN-10:</strong> " +
                        data.isbn_10[0] +
                        "</p>" +

                        "<p><strong>ISBN-13:</strong> " +
                        data.isbn_13[0] +
                        "</p>" +

                        "<p><strong>Contributions:</strong> " +
                        data.contributions[0] +
                        "</p>" +

                         "<p><strong>First Sentence:</strong> " +
                        data.first_sentence.value +
                        "</p>"
                    );
            });
        });
        
                        
    </script>

</body>
</html>
