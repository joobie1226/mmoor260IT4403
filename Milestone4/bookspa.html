<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Open Library SPA - Milestone 4</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://unpkg.com/mustache@4.2.0/mustache.min.js"></script>
  

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header class="header">
        <h1>Open Library Search</h1>
    </header>

    <main>
        <div class="view-navigation">
            <button id="showsearch">Book Search</button>
            <button id="showCollection">History Collection</button>
        </div>

        <div id="searchSection">
      <h2>Book Search</h2>

      <p>Enter a keyword for a book you are interested in.</p>

      <input type="text" id="searchInput" placeholder="enter book title or keyword">

      <button id="searchButton">Search</button>

        <div class="layout-controls">
            <button id="gridView">Grid View</button>
            <button id="listView">List View</button>
        </div>

      <h2> Search Results </h2>

      <div id="searchResults" class="grid-view"></div>

    <script id="bookTemplate" type="x-tmpl-mustache">
        {{#books}}
        <div class="book-card">
            <h3>
                    <a href="#bookDetails" class="book-link"
                        data-workid="{{workID}}">
                            {{title}}
                        </a>
                    </h3>

                    {{#cover}}
                    <img src="{{cover}}" alt="Cover of {{title}}">
                    {{/cover}}

                    {{^cover}}
                    <p>No cover available</p>
                    {{/cover}}
                </div>
                {{/books}}
            </script>

      <div id="pagination" style="display: none;">
        <button id="previousPage">Previous</button>
        <span id="pageInfo"></span>
        <button id="nextPage">Next</button>
      </div>

      <h2>Selected Book Details</h2>

      <div id="bookDetails">
        <p>Select a book for more information about it</p>
      </div>

        <script id="detailsTemplate" type="x-tmpl-mustache">
            <div class="book-details-card">
                <h3>{{title}}</h3>

                <p><strong>Work ID:</strong> {{workID}}</p>

                {{#cover}}
                <img src="{{cover}}" alt="Cover of {{title}}">
                {{/cover}}

                {{^cover}}
                <p>No cover available</p>
                {{/cover}}

                <p><strong>Author(s):</strong> {{authors}}</p>

                <h4>Description:</h4>
                <p>{{description}}</p>

                <h4>Subjects:</h4>
                {{#hasSubjects}}
                <ul>   
                    {{#subjects}}
                    <li>{{name}}</li>
                    {{/subjects}}
                </ul>
                {{/hasSubjects}}

                {{^hasSubjects}}
                <p>No subjects available</p>
                {{/hasSubjects}}

                <p>
                    <a href="{{openLibraryURL}}" target="_blank"
                        rel="noopener noreferrer">
                        View on Open Library
                    </a>
                </p>
            </div>
        </script>

        </div>

        <div id="collectionSection" style="display: none;">

      <h2>Books on History</h2>

      <div id="collectionResults">
        <p>Loading collection...</p>
        
      </div>
        </div>
      
    </main>

   <script src="script.js"></script>
                                                          

</body>
</html>
